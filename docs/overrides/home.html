{% extends "main.html" %}
{% block tabs %}
{{ super() }}

<main class="md-main" data-md-component="main">
    <div class="md-main_inner md-grid">
        <div class="md-content" data-md-component="content">
            <article class="md-content__inner md-typeset">
                <section class="container">
                    <div class="md-grid md-typeset">
                        <div class="logo">
                            <img alt="RavaLink Logo" draggable="false" id="home__logo" src="assets/logo.svg">
                            <h1 id="home__title">RavaLink</h1>
                            <p class="description">
                                A native Rust audio node for the Lavalink v4 ecosystem.
                            </p>
                            <p>
                                <a href="https://discord.gg/PBxB5eFNUp">Join the community on Discord</a>
                                ·
                                <a href="https://github.com/Ravalink-Project/Ravalink">Explore the source code</a>
                            </p>
                        </div>
                    </div>
                </section>
                {{ page.content }}
            </article>
        </div>
    </div>
</main>
{% endblock %}
{% block content %}
{% endblock %}
{% block footer %}
{{ super() }}
{% endblock %}
