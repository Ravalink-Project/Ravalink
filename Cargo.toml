[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/core",
    "crates/audio",
    "crates/server",
    "crates/plugins/plugin-api",
    "crates/plugins/youtube",
    "crates/plugins/lavasrc",
    "crates/plugins/lavasearch",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Ravalink-Project/Ravalink"

[workspace.dependencies]
axum = { version = "0.8", features = ["ws", "macros"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
sysinfo = "0.33"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
opus2 = { version = "0.4", features = ["bundled"] }
crypto_secretbox = { version = "0.1.1", features = ["salsa20"] }
getrandom = "0.3"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
davey = { package = "davey", git = "https://github.com/Snazzah/davey", rev = "1c37646d4c4fa7e69e2fa00cfbe3277d3a7ff3fc" }
