# RavaLink native configuration
# Environment variables override these values.

[server]
address = "0.0.0.0"
port = 2333
# Replace with a long random secret before exposing this node publicly.
password = "replace-with-a-long-random-secret"
player_update_interval = 5

[logging]
level = "info"

[audio]
# Audio buffering and bounded source/cache memory.
buffer_duration_ms = 400
frame_buffer_duration_ms = 5000
opus_encoding_quality = 10
resampling_quality = "low"
# Maximum compressed HTTP(S) source size accepted by the legacy buffered resolver.
max_source_download_bytes = 134217728
# Maximum compressed source bytes retained by the legacy buffered resolver.
max_decoded_cache_bytes = 268435456
# Maximum decoded PCM held by active native players.
max_active_decoded_pcm_bytes = 268435456

[youtube]
# Optional Netscape cookies.txt exported from a browser. Protect this file like a password.
# Enables authenticated requests and age-restricted video access where permitted.
# cookies_file = "/home/container/config/youtube-cookies.txt"
# Optional Google OAuth Device Flow. Create an OAuth client for TVs and limited-input devices.
# On first start, RavaLink prints a verification URL and code in its logs.
# Keep the token file private; it contains a long-lived refresh token.
# oauth_client_id = "YOUR_GOOGLE_OAUTH_CLIENT_ID"
# oauth_client_secret = "YOUR_GOOGLE_OAUTH_CLIENT_SECRET"
# oauth_token_file = "/home/container/config/youtube-oauth-token.json"

[metrics]
prometheus_enabled = false
prometheus_endpoint = "/metrics"

# Community plugin discovery. Each subdirectory contains a
# ravalink-plugin.toml manifest and a native executable. Relative executable
# paths are resolved against the plugin folder. This is not a Java/JAR loader.
plugin_directory = "plugins"

# Optional direct plugin declarations (alternative to plugin manifests).
# Each executable receives a versioned JSON request and returns a Lavalink
# PluginLoadResult JSON object (or null). See docs/plugins/external-process.md.
#
# [[plugins]]
# name = "community-source"
# version = "1.0.0"
# description = "Community source integration"
# capabilities = ["track", "playlist", "search", "source:community"]
# identifier_prefix = "community:"
# program = "/opt/ravalink/plugins/community-source"
# args = ["--stdio"]
# [plugins.environment]
# API_TOKEN = "set-this-outside-version-control"
# [plugins.config]
# region = "eu"
