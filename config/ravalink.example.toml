# RavaLink native configuration
# Environment variables override these values.

[server]
address = "0.0.0.0"
port = 2333
# Replace with a long random secret before exposing this node publicly.
password = "replace-with-a-long-random-secret"
player_update_interval = 5

[logging]
level = "info"

[audio]
# Audio buffering and bounded source/cache memory.
buffer_duration_ms = 400
frame_buffer_duration_ms = 5000
opus_encoding_quality = 10
resampling_quality = "low"
# Maximum compressed HTTP(S) source size accepted by the direct-file resolver.
max_source_download_bytes = 134217728
# Maximum decoded PCM retained in the pending loadtracks cache.
max_decoded_cache_bytes = 268435456
# Maximum decoded PCM held by active native players.
max_active_decoded_pcm_bytes = 268435456

[metrics]
prometheus_enabled = false
prometheus_endpoint = "/metrics"

# Optional out-of-process Rust extensions.
# Each executable receives {"protocolVersion":1,"identifier":"..."} on stdin
# and returns a Lavalink PluginLoadResult JSON object (or null) on stdout.
# Executables run as this server user; only explicitly listed environment
# variables are passed to them. The executable path must be absolute.
#
# [[plugins]]
# name = "community-source"
# version = "1.0.0"
# description = "Community source integration"
# capabilities = ["track", "playlist", "search"]
# identifier_prefix = "community:"
# program = "/opt/ravalink/plugins/community-source"
# args = ["--stdio"]
# [plugins.environment]
# API_TOKEN = "set-this-outside-version-control"
