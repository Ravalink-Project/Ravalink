name: Publish Pelican and Pterodactyl image

on:
  push:
    branches: [master]
    paths:
      - 'Dockerfile.panel'
      - '.github/workflows/panel-image.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: GitHub release tag to package (for example v1.0.0-rc.1)
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish multi-architecture image
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          VERSION="${{ github.event.release.tag_name || inputs.version }}"
          if [[ -z "$VERSION" ]]; then
            VERSION="$(curl --fail --silent --show-error https://api.github.com/repos/Ravalink-Project/Ravalink/releases?per_page=20 | jq -r '[.[] | select(.draft == false)] | first | .tag_name // empty')"
          fi
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "Invalid release tag: $VERSION" >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: https://github.com/Ravalink-Project/Ravalink.git#master
          file: Dockerfile.panel
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            RAVALINK_VERSION=${{ steps.version.outputs.value }}
          tags: |
            ghcr.io/ravalink-project/ravalink:${{ steps.version.outputs.value }}
            ghcr.io/ravalink-project/ravalink:latest
          labels: |
            org.opencontainers.image.source=https://github.com/Ravalink-Project/Ravalink
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
