name: Native build

on:
  push:
    branches: ["rust-native"]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
  workflow_call:

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build release executable
        run: cargo build --release -p ravalink-server
      - name: API smoke test
        run: bash scripts/smoke-test.sh target/release/ravalink
  cross-compile:
    name: Linux ARM64 cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ARM64 executable
        uses: houseabsolute/actions-rust-cross@v1
        with:
          target: aarch64-unknown-linux-gnu
          args: "--release -p ravalink-server"
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build native Docker image
        run: docker build --tag ravalink:ci .
