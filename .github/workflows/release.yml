name: Native release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify source and API smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check release-candidate or stable readiness
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-rc.* ]]; then
            bash scripts/check-rc1-readiness.sh
          else
            bash scripts/check-stable-readiness.sh
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Tests
        run: cargo test --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build server
        run: cargo build --release -p ravalink-server
      - name: API smoke test
        run: bash scripts/smoke-test.sh target/release/ravalink

  binaries:
    name: Linux ${{ matrix.arch }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
            asset: ravalink-linux-x86_64
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
            asset: ravalink-linux-aarch64
    steps:
      - uses: actions/checkout@v4
      - name: Build release binary
        uses: houseabsolute/actions-rust-cross@v1
        with:
          target: ${{ matrix.target }}
          args: "--release -p ravalink-server"
          strip: true
      - name: Stage release asset
        run: |
          install -D "target/${{ matrix.target }}/release/ravalink" "dist/${{ matrix.asset }}"
          chmod 0755 "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release assets
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum ravalink-linux-* > SHA256SUMS
          sha256sum --check SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 2
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          files: |
            dist/ravalink-linux-x86_64
            dist/ravalink-linux-aarch64
            dist/SHA256SUMS
